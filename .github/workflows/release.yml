name: Release

# Builds the Windows and Linux packages and publishes them as a GitHub Release "v<Version>" (from
# Directory.Build.props). Start it either way:
#   - Actions -> Release -> Run workflow (creates the tag and the release), or
#   - push a version tag: git tag v0.4.0 && git push origin v0.4.0 (must match <Version>).
# If the release already exists (made on GitHub's Releases page), the packages are added to it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test ShardForge.slnx -c Release
      - name: Version
        id: v
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match version $v in Directory.Build.props"; exit 1
          fi
      - name: Package
        run: scripts/package.sh win-x64 linux-x64
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "ShardForge $TAG" --notes-file scripts/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" dist/*.zip dist/*.tar.gz --clobber
