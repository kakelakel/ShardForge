name: Release

# Push a version tag (git tag v0.4.0 && git push origin v0.4.0) to build the Windows and Linux packages
# and publish them as a GitHub Release. The tag must match <Version> in Directory.Build.props.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test ShardForge.slnx -c Release
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} doesn't match version $v"; exit 1; }
      - name: Package
        run: scripts/package.sh win-x64 linux-x64
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.tar.gz \
            --title "ShardForge ${GITHUB_REF_NAME}" --notes-file scripts/RELEASE_NOTES.md
      - name: Keep the packages (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: shardforge-packages
          path: dist/*.*
